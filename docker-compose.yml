name: hybrid-product-search

services:
  solr:
    image: solr:9.7
    command: solr-precreate products
    ports:
      - "8983:8983"
    environment:
      SOLR_HEAP: 1g
    volumes:
      - solr-data:/var/solr

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"

volumes:
  solr-data:
