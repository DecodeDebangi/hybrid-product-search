name: hybrid-product-search

# `docker compose up -d` starts only Solr and Redis, for local development.
# `docker compose --profile app up -d` also runs the embedder, API and web UI in containers.
# `docker compose run --rm ingest` indexes the catalog into the containerised stack.
services:
  solr:
    image: solr:9.7
    command: solr-precreate products
    ports:
      - "8983:8983"
    environment:
      SOLR_HEAP: 1g
    volumes:
      - solr-data:/var/solr
    healthcheck:
      # Healthy once the products core answers queries, not just when the JVM is up.
      test: ["CMD", "curl", "-sf", "http://localhost:8983/solr/products/admin/ping"]
      interval: 3s
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s

  embedder:
    profiles: [app]
    build: services/ml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      start_period: 60s

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      SOLR_URL: http://solr:8983/solr/products
      EMBEDDER_URL: http://embedder:8001
      REDIS_URL: redis://redis:6379
    volumes:
      - images:/data/images:ro
    depends_on:
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedder:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3100:3100"
    depends_on:
      - api

  ingest:
    profiles: [ingest]
    build:
      context: services/ml
      args:
        EXTRAS: ingest
    command: ["product-search-ingest", "--solr-url", "http://solr:8983/solr/products", "--images-dir", "/data/images"]
    volumes:
      - images:/data/images
    depends_on:
      solr:
        condition: service_healthy

volumes:
  solr-data:
  images:
