[project]
name = "product-search-ml"
version = "0.1.0"
description = "CLIP embedding service and ingestion pipeline for hybrid-product-search"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "open-clip-torch>=2.29",
  "pillow>=11",
  "python-multipart>=0.0.20",
  "torch>=2.5,<2.15",  # 2.15 has no matching CPU torchvision wheel yet
  "torchvision>=0.20",  # direct, so the CPU index source below applies to it
  "tqdm>=4.67",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Only ingestion downloads the catalog; keeping it out saves the embedder image pyarrow and pandas.
ingest = ["datasets>=3.2"]

[project.scripts]
product-search-embedder = "product_search_ml.server:main"
product-search-ingest = "product_search_ml.ingest:main"
product-search-eval = "product_search_ml.evaluate:main"
product-search-grade = "product_search_ml.grader:main"
product-search-attribute-queries = "product_search_ml.attribute_queries:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_search_ml"]

# Containers run on CPU; the default Linux wheels bundle ~2.5 GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
