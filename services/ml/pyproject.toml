[project]
name = "findwise-ml"
version = "0.1.0"
description = "CLIP embedding service and ingestion pipeline for Findwise"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets>=3.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "open-clip-torch>=2.29",
  "pillow>=11",
  "python-multipart>=0.0.20",
  "torch>=2.5",
  "tqdm>=4.67",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
findwise-embedder = "findwise_ml.server:main"
findwise-ingest = "findwise_ml.ingest:main"
findwise-eval = "findwise_ml.evaluate:main"
findwise-grade = "findwise_ml.grader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findwise_ml"]
